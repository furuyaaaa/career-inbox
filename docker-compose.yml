services:
  web:
    image: nginx:1.29-alpine
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - composer-vendor:/var/www/html/vendor
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  app:
    build:
      context: ./docker/php
    volumes:
      - ./src:/var/www/html
      - node-modules:/var/www/html/node_modules
    env_file:
      - ./src/.env
    environment:
      COMPOSER_PROCESS_TIMEOUT: 1200
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: career_inbox
      POSTGRES_USER: career_inbox
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career_inbox -d career_inbox"]
      interval: 5s
      timeout: 5s
      retries: 12

  node:
    image: node:24-alpine
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    profiles:
      - frontend

volumes:
  postgres-data:
  composer-vendor:
  node-modules:
